version: '3.8'

services:
  mongodb:
    image: mongo:7-alpine
    container_name: joineazy_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - joineazy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/joineazy}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_please_change_in_production_32_chars_min}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - joineazy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joineazy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - joineazy-network

volumes:
  mongodb_data:
    driver: local

networks:
  joineazy-network:
    driver: bridge
