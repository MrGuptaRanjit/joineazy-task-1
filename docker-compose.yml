version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: joineazy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-joineazy_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-joineazy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - joineazy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-joineazy_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_password_change_me}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_please_change_in_production_32_chars_min}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - joineazy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joineazy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - joineazy-network

volumes:
  postgres_data:
    driver: local

networks:
  joineazy-network:
    driver: bridge
