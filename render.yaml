services:
  - type: web
    name: joineazy-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-db
          property: connectionString

databases:
  - name: joineazy-db
    databaseName: joineazy_db
    user: joineazy_user
    plan: free
